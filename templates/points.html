<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement Public | GUDLFT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h3 class="mb-0">Tableau Public des Points</h3>
                        <small class="text-white-50">Transparence fédérale — Consultation en lecture seule</small>
                    </div>
                    <div class="card-body p-4">
                        <table class="table table-striped table-hover align-middle mt-2">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nom de l'Association / Club</th>
                                    <th class="text-end">Balance des Crédits</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for club in clubs %}
                                <tr>
                                    <td><strong>{{ club['name'] }}</strong></td>
                                    <td class="text-end"><span class="badge bg-success px-3 py-2">{{ club['points'] }} pts</span></td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                        
                        <div class="text-center mt-4">
                            <a href="{{ url_for('index') }}" class="btn btn-primary">Retour à la page de connexion</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
